namespaces:
  infra: infra
  app: app

postgres:
  image: postgres:15-alpine
  env:
    POSTGRES_DB: kubecoin
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password
  volume:
    name: postgres-storage
    size: 1Gi
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"

kafka:
  enabled: true
  image: bitnami/kafka:3.7
  env:
    KAFKA_CFG_NODE_ID: "0"
    KAFKA_CFG_PROCESS_ROLES: "controller,broker"
    KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
    KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
    KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka.infra.svc.cluster.local:9092"
    KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka-0.kafka.infra.svc.cluster.local:9093"
    KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ALLOW_PLAINTEXT_LISTENER: "yes"
  volume:
    name: kafka-storage
    size: 2Gi
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"

backend:
  image:
    repository: docker.io/privatergistry/kubecoin-backend
    tag: latest
  env:
    DB_HOST: postgres-headless.infra.svc.cluster.local
    DB_NAME: kubecoin
    DB_USER: postgres
    DB_PASSWORD: password
    KAFKA_BOOTSTRAP_SERVERS: kafka.infra.svc.cluster.local:9092
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"

frontend:
  image:
    repository: docker.io/privatergistry/kubecoin-frontend
    tag: latest
  env:
    BACKEND_URL: http://backend-service.app.svc.cluster.local:5000
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
